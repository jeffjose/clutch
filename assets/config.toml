# clutch: the keys it takes, and what each runs.
#
# Only the box is bound to begin with. The other lines are examples: take
# the # off the front of one to bind it.
#
# A key is written with its modifiers: "ctrl+space", "super+shift+s",
# "print". The modifiers are ctrl, shift, alt and super. Keys pressed one
# after another have a space between them: "super+space t" is Super+Space,
# then T.
#
# What a key runs is a shell command. This file is read again whenever it
# is saved, and `clutch status` shows what is bound.

# How long, in milliseconds, a sequence waits for its next key.
# timeout = 2000

[bind]
# The box that finds windows, projects and applications, and has the
# controls for Wi-Fi and sound. In it Alt and a letter goes to a project,
# so with Alt+K the same Alt opens the box and picks from it. Super is
# the key some call Cmd or Win. Ctrl+K works too, but it is taken from
# every program then: the shell's kill-line, and the start of many of VS
# Code's keys.
"alt+k" = "clutch palette"
# "super+k" = "clutch palette"

# A drop-down terminal, visor: Ghostty running screen, brought in from an
# edge of the screen and sent away again. [visor] below says where.
# "ctrl+space" = "clutch visor"
# "ctrl+shift+space" = "clutch palette '>visor'"   # its shapes, in the box
# "ctrl+super+up" = "clutch visor top"
# "ctrl+super+down" = "clutch visor bottom"
# "ctrl+super+left" = "clutch visor left"
# "ctrl+super+right" = "clutch visor right"
# "ctrl+super+equal" = "clutch visor bigger"
# "ctrl+super+minus" = "clutch visor smaller"
# "ctrl+super+g" = "clutch visor grow"
# "ctrl+super+f" = "clutch visor full"

# A sequence:
# "super+space t" = "xterm"

[links]
# Searches from the box: the word, a slash, and what to look for.
# "g/rust lifetimes" searches Google; {} is what comes after the slash.
# An address without {} opens as it is: "mail" alone opens your mail.
# What matches nothing in the box is offered to g, too.
g = "https://www.google.com/search?q={}"
gh = "https://github.com/search?q={}"
yt = "https://www.youtube.com/results?search_query={}"
# ddg = "https://duckduckgo.com/?q={}"
# maps = "https://www.google.com/maps/search/{}"
# images = "https://www.google.com/search?tbm=isch&q={}"
# w = "https://en.wikipedia.org/wiki/Special:Search?search={}"
# r = "https://www.reddit.com/search/?q={}"
# so = "https://stackoverflow.com/search?q={}"
# mdn = "https://developer.mozilla.org/en-US/search?q={}"
# crates = "https://crates.io/search?q={}"
# docs = "https://docs.rs/{}"
# npm = "https://www.npmjs.com/search?q={}"
# pypi = "https://pypi.org/search/?q={}"
# amazon = "https://www.amazon.com/s?k={}"
# imdb = "https://www.imdb.com/find/?q={}"
# t = "https://translate.google.com/?sl=auto&tl=en&text={}"
# claude = "https://claude.ai/new?q={}"
# mail = "https://mail.google.com"
# cal = "https://calendar.google.com"

# Widgets: a program's output, as a tile beside the list. clutch runs it
# every so many seconds and keeps what it printed, so the box shows it at
# once. The tile is the same for all: a title and a value, a bar with a
# tick, and a line. Each is filled from what the program prints: {field}
# is a field of its JSON ({field:.1} to one place, {field:+.1} with a
# sign), or of plain text {text}, {line1}, {line2}…
# [widgets.disk]
# run = "df --output=pcent / | tail -1"
# every = 300
# title = "Disk"
# value = "{text}"
# bar = "text"              # how full, out of max (100 unless it says)
# line = "of /"
# warn = "text > 80"        # amber, when this holds
# bad = "text > 95"         # red
# open = "xdg-open ~"       # what a click runs

# The drop-down terminal. Each line here is as it is when left out.
# [visor]
# shape = "top"             # top, top-centered, bottom, left-half, right-half,
#                           # right-third, corner, floating, full, peek
# edge = "top"              # or say it yourself: top, bottom, left, right, center
# width = "100%"
# height = "40%"
# align = "center"          # where it does not fill its edge: left, center, right
# gap = 0                   # pixels between it and the edges of the screen
# grow = ["40%", "70%", "100%"]   # the sizes `clutch visor grow` goes through
# monitor = "in use"        # the one the pointer is on, or "main"
# slide = true              # in from its edge, and out to it (on GNOME)
# hide_on_click_away = false
# run = "ghostty --class=io.github.jeffjose.visor --gtk-single-instance=false --window-decoration=false -e screen -dRR"
