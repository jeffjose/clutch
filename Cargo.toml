[package]
name = "clutch"
version = "0.1.0"
edition = "2021"
description = "Keys that are yours before any program's"
license = "MIT"

[dependencies]
evdev = "0.13"
fontdue = "0.9"
libc = "0.2"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std", "preserve_order"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
x11rb = { version = "0.14", features = ["randr", "shape", "xfixes"] }

# softbuffer with see-through pixels on Wayland: vendor/softbuffer/CLUTCH.md.
[patch.crates-io]
softbuffer = { path = "vendor/softbuffer" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
