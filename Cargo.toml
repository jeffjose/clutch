[package]
name = "clutch"
version = "0.1.0"
edition = "2021"
description = "Keys that are yours before any program's"
license = "MIT"

[dependencies]
evdev = "0.13"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std", "preserve_order"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
